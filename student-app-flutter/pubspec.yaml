name: vels_student
description: Vels University Bus Tracker – Student App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # HTTP client
  dio: ^5.4.3+1

  # Real-time WebSocket
  socket_io_client: ^2.0.3+1

  # Location & Maps
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Navigation
  go_router: ^14.1.4

  # JSON Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Design & Styling
  google_fonts: ^6.2.1
  skeletonizer: any

  # Local Persistence
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
