name: Deploy Admin Portal → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin-portal/**'
      - '.github/workflows/deploy-admin.yml'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Build ───────────────────────────────────────────────────
  build:
    name: Build Admin Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install dependencies
        working-directory: admin-portal
        run: npm ci

      - name: Build
        working-directory: admin-portal
        env:
          # Point the deployed frontend at the live Serveo tunnel.
          VITE_API_URL: https://5eee121c20fa506e-122-164-87-106.serveousercontent.com/v1
          VITE_SOCKET_URL: https://5eee121c20fa506e-122-164-87-106.serveousercontent.com
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-portal/dist

  # ── Deploy ──────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
